services:
  ollama:
    build:
      context: ./docker/ollama
    container_name: aso-ollama
    environment:
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
    volumes:
      - ollama_data:/root/.ollama        # Persist downloaded models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia             # Requires NVIDIA driver + Container Toolkit
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Healthy only after the model has been pulled
      test: ["CMD-SHELL", "ollama list | grep -q \"$$OLLAMA_MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 180                        # Up to ~30 min for the first download
      start_period: 30s
    networks:
      - aso-network

  mcp-server:
    build:
      context: .
      dockerfile: ./docker/mcp-server/Dockerfile
    container_name: aso-mcp-server
    environment:
      FLAG: "${FLAG:?Set FLAG in .env (see .env.example)}"
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro                   # Managed directory, read-only
    networks:
      - aso-network

  adk-web:
    build:
      context: .
      dockerfile: ./docker/adk-web/Dockerfile
    container_name: aso-adk-web
    environment:
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
    ports:
      - "127.0.0.1:8080:8080"             # Web UI, reachable only from this machine
    depends_on:
      ollama:
        condition: service_healthy
      mcp-server:
        condition: service_started
    networks:
      - aso-network

networks:
  aso-network:
    driver: bridge

volumes:
  ollama_data: